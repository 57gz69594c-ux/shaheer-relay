<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Claude Relay</title>
<style>
  :root {
    color-scheme: dark;
    --g: #33ff66;
    --g-hi: #b8ffcf;
    --g-dim: #1f9e48;
    --g-faint: #0f5226;
    --g-bg: #062b14;
    --amber: #ffb43d;
    --red: #ff5a4d;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: #000; }
  body {
    margin: 0 auto;
    max-width: 560px;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
    color: var(--g);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.45;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--g-faint);
  }
  .led {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--g);
    box-shadow: 0 0 8px var(--g);
  }
  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--g-hi);
    text-shadow: 0 0 10px rgba(51, 255, 102, .35);
  }

  .tabs { display: flex; gap: 8px; margin: 16px 0; }
  .tab {
    flex: 1;
    min-height: 44px;
    margin: 0;
    padding: 10px;
    background: transparent;
    color: var(--g-dim);
    border: 1px solid var(--g-faint);
    border-radius: 6px;
    font-size: 14px;
  }
  .tab.active { background: var(--g-bg); color: var(--g-hi); border-color: var(--g-dim); }

  .panel { display: none; }
  .panel.active { display: block; }

  textarea {
    display: block;
    width: 100%;
    padding: 12px;
    background: #000;
    color: var(--g-hi);
    caret-color: var(--g);
    border: 1px solid var(--g-faint);
    border-radius: 6px;
    outline: none;
    resize: vertical;
    font-family: var(--mono);
    font-size: 16px; /* 16px or more: iOS never zooms on focus */
    line-height: 1.45;
  }
  textarea:focus { border-color: var(--g-dim); }
  textarea::placeholder { color: var(--g-dim); opacity: 1; }
  #note { min-height: 34vh; }
  #recv-text { min-height: 56vh; overflow-wrap: anywhere; }

  button, .pick {
    display: block;
    width: 100%;
    min-height: 48px;
    margin-top: 10px;
    padding: 12px;
    background: #000;
    color: var(--g);
    border: 1px solid var(--g-dim);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 15px;
    text-align: center;
    cursor: pointer;
  }
  button:active, .pick:active { background: var(--g-bg); color: var(--g-hi); }
  button.main { background: var(--g-bg); color: var(--g-hi); }
  button:disabled { color: var(--g-faint); border-color: var(--g-faint); background: #000; }

  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }

  .rule { margin: 22px 0 12px; border: 0; border-top: 1px solid var(--g-faint); }

  #fileInput {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  #fileInput:focus-visible + .pick { border-color: var(--g-hi); }
  .pick { color: var(--g-dim); border-style: dashed; margin-top: 0; }
  .pick.has { color: var(--g-hi); border-color: var(--g-dim); overflow-wrap: anywhere; }

  .msg { min-height: 1.45em; margin-top: 10px; font-size: 13px; text-align: center; color: var(--g-dim); }
  .ok { color: var(--g); }
  .err { color: var(--red); }

  #file-progress { display: none; margin-top: 10px; }
  .bar { height: 6px; border: 1px solid var(--g-faint); border-radius: 3px; overflow: hidden; }
  #progress-bar { width: 0; height: 100%; background: var(--g); transition: width .3s; }
  #progress-text { margin-top: 6px; font-size: 12px; text-align: center; color: var(--g-dim); overflow-wrap: anywhere; }
</style>
</head>
<body>
  <header>
    <span class="led"></span>
    <h1>CLAUDE RELAY</h1>
  </header>

  <div class="tabs">
    <button type="button" class="tab active" id="tab-send">Send</button>
    <button type="button" class="tab" id="tab-recv">From Claude</button>
  </div>

  <div class="panel active" id="panel-send">
    <textarea id="note" placeholder="Paste text, keys, links here..."></textarea>
    <button type="button" id="send" class="main">Send</button>
    <div class="msg" id="status"></div>

    <hr class="rule">

    <input type="file" id="fileInput" multiple>
    <label class="pick" id="pick" for="fileInput">Choose files</label>
    <button type="button" id="sendFile">Send Files</button>
    <div class="msg" id="file-status"></div>
    <div id="file-progress">
      <div class="bar"><div id="progress-bar"></div></div>
      <div id="progress-text"></div>
    </div>
  </div>

  <div class="panel" id="panel-recv">
    <textarea id="recv-text" placeholder="Nothing loaded yet." readonly></textarea>
    <div class="row">
      <button type="button" id="refresh" class="main">Refresh</button>
      <button type="button" id="copy">Copy</button>
    </div>
    <div class="msg" id="recv-status"></div>
  </div>

<script>
if (!sessionStorage.getItem('relay_cache_bust_v91')) {
  sessionStorage.setItem('relay_cache_bust_v91', '1');
  location.replace(location.pathname + '?v=' + Date.now());
}

(function () {
  const IN_BIN = 'shaheer-relay-dydhytrzlufq6zwo';
  const $ = (id) => document.getElementById(id);

  function say(el, text, cls) {
    el.textContent = text;
    el.className = 'msg' + (cls ? ' ' + cls : '');
  }

  // Tabs
  ['send', 'recv'].forEach((t) => {
    $('tab-' + t).addEventListener('click', () => {
      ['send', 'recv'].forEach((x) => {
        $('tab-' + x).classList.toggle('active', x === t);
        $('panel-' + x).classList.toggle('active', x === t);
      });
      if (t === 'recv') loadLatest();
    });
  });

  // Upload one blob to the relay bin
  function upload(filename, blob, timeout, onProgress) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', 'https://filebin.net/' + IN_BIN + '/' + filename);
      xhr.setRequestHeader('Content-Type', 'text/plain');
      xhr.timeout = timeout;
      if (onProgress) xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
      xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('HTTP ' + xhr.status));
      xhr.onerror = () => reject(new Error('network error'));
      xhr.ontimeout = () => reject(new Error('timeout'));
      xhr.send(blob);
    });
  }

  // Send text
  const sendBtn = $('send'), note = $('note'), sendStatus = $('status');
  sendBtn.addEventListener('click', async () => {
    const text = note.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    say(sendStatus, 'Sending...');
    try {
      await upload('note-' + Date.now() + '.txt', new Blob([text], { type: 'text/plain' }), 30000);
      say(sendStatus, 'Sent. Claude will see it next.', 'ok');
      note.value = '';
    } catch (e) {
      say(sendStatus, 'Failed: ' + e.message, 'err');
    } finally {
      sendBtn.disabled = false;
    }
  });

  // Send files
  const fileInput = $('fileInput'), pick = $('pick'), sendFileBtn = $('sendFile'), fileStatus = $('file-status');
  const progress = $('file-progress'), progressBar = $('progress-bar'), progressText = $('progress-text');

  function showPicked() {
    const n = fileInput.files.length;
    pick.textContent = n === 0 ? 'Choose files' : n === 1 ? fileInput.files[0].name : n + ' files chosen';
    pick.classList.toggle('has', n > 0);
  }
  fileInput.addEventListener('change', showPicked);

  sendFileBtn.addEventListener('click', async () => {
    const files = fileInput.files;
    if (!files.length) { say(fileStatus, 'Choose files first.', 'err'); return; }
    sendFileBtn.disabled = true;
    progress.style.display = 'block';
    progressBar.style.width = '0';
    const total = files.length;
    let done = 0, failed = 0;
    say(fileStatus, 'Uploading ' + total + ' file' + (total > 1 ? 's' : '') + '...');
    for (let i = 0; i < total; i++) {
      const file = files[i];
      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      progressText.textContent = (i + 1) + ' of ' + total + ': ' + file.name;
      try {
        await upload('file-' + Date.now() + '-' + i + '-' + safeName, new Blob([file], { type: 'text/plain' }), 900000,
          (part) => { progressBar.style.width = ((i + part) / total * 100) + '%'; });
        done++;
      } catch (e) { failed++; }
      progressBar.style.width = ((i + 1) / total * 100) + '%';
    }
    say(fileStatus, failed === 0 ? 'All ' + done + ' sent.' : done + ' sent, ' + failed + ' failed.', failed === total ? 'err' : 'ok');
    progressText.textContent = 'Done.';
    fileInput.value = '';
    showPicked();
    sendFileBtn.disabled = false;
  });

  // From Claude
  const recvText = $('recv-text'), recvStatus = $('recv-status'), refreshBtn = $('refresh');

  async function loadLatest() {
    refreshBtn.disabled = true;
    say(recvStatus, 'Loading...');
    try {
      const resp = await fetch('./outbox.txt?t=' + Date.now(), { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const text = await resp.text();
      if (/^\s*<(!DOCTYPE|html)/i.test(text)) throw new Error('got a webpage');
      recvText.value = text;
      say(recvStatus, 'Updated just now.', 'ok');
    } catch (e) {
      say(recvStatus, 'Failed: ' + e.message, 'err');
    } finally {
      refreshBtn.disabled = false;
    }
  }
  refreshBtn.addEventListener('click', loadLatest);

  $('copy').addEventListener('click', async () => {
    if (!recvText.value) return;
    try { await navigator.clipboard.writeText(recvText.value); }
    catch (e) { recvText.select(); document.execCommand('copy'); }
    say(recvStatus, 'Copied.', 'ok');
  });
})();
</script>
</body>
</html>
