<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Claude Relay v3</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, sans-serif;
    background: #111318;
    color: #e8e8ec;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
    box-sizing: border-box;
  }
  h1 { font-size: 1.2rem; font-weight: 600; margin: 0 0 4px; }
  p.sub { color: #9a9aa5; font-size: 0.85rem; margin: 0 0 20px; text-align: center; }
  .tabs {
    display: flex;
    width: 100%;
    max-width: 480px;
    margin-bottom: 18px;
    border: 1px solid #2e323d;
    border-radius: 10px;
    overflow: hidden;
  }
  .tab {
    flex: 1;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    background: #1b1e26;
    color: #9a9aa5;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .tab.active { background: #4f7cff; color: white; }
  .panel { width: 100%; max-width: 480px; display: none; flex-direction: column; align-items: center; }
  .panel.active { display: flex; }
  textarea {
    width: 100%;
    max-width: 480px;
    min-height: 200px;
    background: #1b1e26;
    color: #e8e8ec;
    border: 1px solid #2e323d;
    border-radius: 10px;
    padding: 14px;
    font-size: 1rem;
    font-family: ui-monospace, monospace;
    box-sizing: border-box;
    resize: vertical;
  }
  button {
    margin-top: 14px;
    width: 100%;
    max-width: 480px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #4f7cff;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: #2e323d; color: #e8e8ec; }
  button:disabled { background: #333844; color: #888; }
  #status, #recv-status {
    margin-top: 14px;
    font-size: 0.9rem;
    min-height: 1.2em;
    text-align: center;
  }
  .ok { color: #6ee08a; }
  .err { color: #ff6e6e; }
  .recv-meta { color: #9a9aa5; font-size: 0.75rem; margin-top: 8px; text-align: center; }

  /* --- Clip Review Styles --- */
  .clip-card {
    width: 100%;
    background: #1b1e26;
    border: 1px solid #2e323d;
    border-radius: 12px;
    margin-bottom: 20px;
    padding: 14px;
    box-sizing: border-box;
  }
  .clip-title {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 10px;
    color: #4f7cff;
  }
  .aspect-label {
    font-size: 0.78rem;
    color: #9a9aa5;
    margin: 8px 0 4px;
    font-weight: 600;
  }
  .clip-card video {
    width: 100%;
    border-radius: 8px;
    margin-bottom: 6px;
    background: #000;
  }
  .approve-row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .btn-vote {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    background: #2e323d;
    color: #e8e8ec;
  }
  .btn-vote.approve-sel { background: #2d8a4e; color: white; }
  .btn-vote.reject-sel { background: #8a2d2d; color: white; }
  #review-result {
    text-align: center;
    margin-top: 14px;
    font-size: 0.95rem;
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <h1>Claude Relay</h1>
  <p class="sub">Send, receive, or review clips.</p>

  <div class="tabs">
    <div class="tab active" id="tab-send">Send</div>
    <div class="tab" id="tab-recv">From Claude</div>
    <div class="tab" id="tab-review">🎬 Clips</div>
  </div>

  <!-- SEND TAB -->
  <div class="panel active" id="panel-send">
    <textarea id="note" placeholder="Paste text, keys, links here..." autofocus></textarea>
    <button id="send">Send</button>
    <div id="status"></div>
    <p class="sub" style="margin:18px 0 6px;">— or send a file/image —</p>
    <input type="file" id="fileInput" accept="image/*,.pdf" style="width:100%;max-width:480px;color:#e8e8ec;">
    <button id="sendFile" class="secondary">Send File</button>
    <div id="file-status"></div>
  </div>

  <!-- RECEIVE TAB -->
  <div class="panel" id="panel-recv">
    <textarea id="recv-text" placeholder="Tap Refresh to load the latest from Claude..." readonly></textarea>
    <button id="refresh">Refresh</button>
    <button id="copy" class="secondary">Copy</button>
    <div id="recv-status"></div>
    <div class="recv-meta" id="recv-meta"></div>
  </div>

  <!-- CLIP REVIEW TAB -->
  <div class="panel" id="panel-review">
    <p class="sub" style="margin-bottom:14px;">Enhanced clips — Landscape + Portrait for each.</p>
    <p class="sub" style="margin-bottom:14px;">Watch both versions. Approve or reject. Submit when done.</p>
    <div id="clips-container"></div>
    <button id="submit-review">Submit Review</button>
    <div id="review-result"></div>
  </div>

  <p id="build" style="margin-top:24px;color:#4a4d57;font-size:0.7rem;">build: relay-v14 — FILE UPLOAD CORS FIX — Aug 16</p>

<script>
if (!sessionStorage.getItem('relay_cache_bust_v14')) {
  sessionStorage.setItem('relay_cache_bust_v14', '1');
  location.replace(location.pathname + '?v=' + Date.now());
}

const IN_BIN = "shaheer-relay-dydhytrzlufq6zwo";
const OUT_BIN = "shaheer-relay-out-b83toafpulxqmhms";
const SERVER = "https://104.248.159.95.nip.io/preview/enhanced";

// --- tabs ---
const tabs = ['send','recv','review'];
tabs.forEach(t => {
  document.getElementById('tab-'+t).addEventListener('click', () => {
    tabs.forEach(x => {
      document.getElementById('tab-'+x).classList.toggle('active', x===t);
      document.getElementById('panel-'+x).classList.toggle('active', x===t);
    });
    if (t === 'recv') loadLatest();
  });
});

// --- send tab ---
const btn = document.getElementById('send');
const status = document.getElementById('status');
const note = document.getElementById('note');

btn.addEventListener('click', async () => {
  const text = note.value.trim();
  if (!text) return;
  btn.disabled = true;
  status.textContent = 'Sending...';
  status.className = '';
  const filename = 'note-' + Date.now() + '.txt';
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://filebin.net/' + IN_BIN + '/' + filename);
    xhr.setRequestHeader('Content-Type', 'text/plain');
    xhr.timeout = 30000;
    await new Promise((resolve, reject) => {
      xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('HTTP ' + xhr.status));
      xhr.onerror = () => reject(new Error('network error'));
      xhr.ontimeout = () => reject(new Error('timeout'));
      xhr.send(new Blob([text], { type: 'text/plain' }));
    });
    status.textContent = 'Sent. Claude will see it next.';
    status.className = 'ok';
    note.value = '';
  } catch (e) {
    status.textContent = 'Failed: ' + e.message;
    status.className = 'err';
  } finally {
    btn.disabled = false;
  }
});

// --- send file/image ---
const fileInput = document.getElementById('fileInput');
const sendFileBtn = document.getElementById('sendFile');
const fileStatus = document.getElementById('file-status');

sendFileBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) { fileStatus.textContent = 'Choose a file first.'; fileStatus.className = 'err'; return; }
  sendFileBtn.disabled = true;
  fileStatus.textContent = 'Uploading...';
  fileStatus.className = '';
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  const filename = 'file-' + Date.now() + '-' + safeName;
  try {
    // filebin's CORS preflight doesn't answer non-safelisted content-types correctly,
    // so we wrap the real bytes in a text/plain-labeled blob to skip preflight entirely
    // (same fix as the vintage-video share flow).
    const safeBlob = new Blob([file], { type: 'text/plain' });
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://filebin.net/' + IN_BIN + '/' + filename);
    xhr.setRequestHeader('Content-Type', 'text/plain');
    xhr.timeout = 60000;
    await new Promise((resolve, reject) => {
      xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('HTTP ' + xhr.status));
      xhr.onerror = () => reject(new Error('network error'));
      xhr.ontimeout = () => reject(new Error('timeout'));
      xhr.send(safeBlob);
    });
    fileStatus.textContent = 'Sent. Claude will see it next.';
    fileStatus.className = 'ok';
    fileInput.value = '';
  } catch (e) {
    fileStatus.textContent = 'Failed: ' + e.message;
    fileStatus.className = 'err';
  } finally {
    sendFileBtn.disabled = false;
  }
});

// --- receive tab ---
const recvText = document.getElementById('recv-text');
const recvStatus = document.getElementById('recv-status');
const recvMeta = document.getElementById('recv-meta');
const refreshBtn = document.getElementById('refresh');
const copyBtn = document.getElementById('copy');

async function loadLatest() {
  refreshBtn.disabled = true;
  recvStatus.textContent = 'Loading...';
  recvStatus.className = '';
  try {
    const resp = await fetch('./outbox.txt?t=' + Date.now(), { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    if (/^\s*<(!DOCTYPE|html)/i.test(text)) {
      throw new Error('got a webpage instead of the file');
    }
    recvText.value = text;
    recvStatus.textContent = 'Loaded.';
    recvStatus.className = 'ok';
    recvMeta.textContent = 'updated just now';
  } catch (e) {
    recvStatus.textContent = 'Failed: ' + e.message;
    recvStatus.className = 'err';
  } finally {
    refreshBtn.disabled = false;
  }
}

refreshBtn.addEventListener('click', loadLatest);
copyBtn.addEventListener('click', async () => {
  if (!recvText.value) return;
  try {
    await navigator.clipboard.writeText(recvText.value);
    recvStatus.textContent = 'Copied.';
    recvStatus.className = 'ok';
  } catch (e) {
    recvText.select();
    document.execCommand('copy');
    recvStatus.textContent = 'Copied.';
    recvStatus.className = 'ok';
  }
});

// --- clip review tab ---
const clips = [
  { id: "01", title: "1. House Reading", mood: "Mysterious", landscape: "preview_landscape/01_house_reading_ENHANCED.mp4", portrait: "preview_portrait/01_house_reading_ENHANCED.mp4" },
  { id: "02", title: "2. First Experience Age 12", mood: "Wonder", landscape: "preview_landscape/02_first_experience_ENHANCED.mp4", portrait: "preview_portrait/02_first_experience_ENHANCED.mp4" },
  { id: "03", title: "3. Car Crash OBE", mood: "Dramatic", landscape: "preview_landscape/03_car_crash_ENHANCED.mp4", portrait: "preview_portrait/03_car_crash_ENHANCED.mp4" },
  { id: "04", title: "4. Mushroom vs Astral", mood: "Intense", landscape: "preview_landscape/04_mushroom_ENHANCED.mp4", portrait: "preview_portrait/04_mushroom_ENHANCED.mp4" },
  { id: "05", title: "5. Project Stargate", mood: "Serious", landscape: "preview_landscape/05_stargate_ENHANCED.mp4", portrait: "preview_portrait/05_stargate_ENHANCED.mp4" },
  { id: "06", title: "6. Nobody Has Ever Died", mood: "Profound", landscape: "preview_landscape/06_nobody_died_ENHANCED.mp4", portrait: "preview_portrait/06_nobody_died_ENHANCED.mp4" },
  { id: "07", title: "7. 9/11 Astral Visit", mood: "Solemn", landscape: "preview_landscape/07_911_astral_ENHANCED.mp4", portrait: "preview_portrait/07_911_astral_ENHANCED.mp4" }
];

const decisions = {};
const container = document.getElementById('clips-container');

clips.forEach(c => {
  const card = document.createElement('div');
  card.className = 'clip-card';
  card.innerHTML = `
    <div class="clip-title">${c.title} <span style="font-size:0.75rem;color:#9a9aa5;font-weight:400;">— ${c.mood}</span></div>
    <div class="aspect-label">LANDSCAPE (16:9) — YouTube Ads</div>
    <video controls playsinline preload="metadata">
      <source src="${SERVER}/${c.landscape}" type="video/mp4">
    </video>
    <div class="aspect-label">PORTRAIT (9:16) — Instagram Reels / Shorts</div>
    <video controls playsinline preload="metadata">
      <source src="${SERVER}/${c.portrait}" type="video/mp4">
    </video>
    <div class="approve-row">
      <button class="btn-vote" data-id="${c.id}" data-v="approved" onclick="vote(this)">Approve</button>
      <button class="btn-vote" data-id="${c.id}" data-v="rejected" onclick="vote(this)">Reject</button>
    </div>
  `;
  container.appendChild(card);
});

function vote(el) {
  const id = el.dataset.id;
  const v = el.dataset.v;
  decisions[id] = v;
  const row = el.parentElement;
  row.querySelectorAll('.btn-vote').forEach(b => {
    b.classList.remove('approve-sel','reject-sel');
  });
  el.classList.add(v === 'approved' ? 'approve-sel' : 'reject-sel');
}

document.getElementById('submit-review').addEventListener('click', async () => {
  const res = document.getElementById('review-result');
  const decided = Object.keys(decisions).length;
  if (decided < clips.length) {
    res.textContent = `Review all clips first (${decided}/${clips.length})`;
    res.style.color = '#ff6e6e';
    return;
  }
  const summary = clips.map(c => `${c.title}: ${decisions[c.id]}`).join('\n');
  const payload = `CLIP REVIEW — ${new Date().toISOString()}\n\n${summary}\n`;
  try {
    const filename = 'review-' + Date.now() + '.txt';
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://filebin.net/' + IN_BIN + '/' + filename);
    xhr.setRequestHeader('Content-Type', 'text/plain');
    xhr.timeout = 30000;
    await new Promise((resolve, reject) => {
      xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? resolve() : reject(new Error('HTTP ' + xhr.status));
      xhr.onerror = () => reject(new Error('network error'));
      xhr.ontimeout = () => reject(new Error('timeout'));
      xhr.send(new Blob([payload], { type: 'text/plain' }));
    });
    res.textContent = '✅ Review sent! Claude will see it.';
    res.style.color = '#6ee08a';
  } catch (e) {
    res.textContent = 'Failed: ' + e.message;
    res.style.color = '#ff6e6e';
  }
});
</script>
</body>
</html>
